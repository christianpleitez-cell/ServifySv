name: ServifySV
options:
  bundleIdPrefix: com.servifysv
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""

targets:
  ServifySV:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ServifySV
        excludes:
          - "**/*.plist"
    info:
      path: ServifySV/Resources/Info.plist
      createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servifysv.app
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: ServifySV/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
